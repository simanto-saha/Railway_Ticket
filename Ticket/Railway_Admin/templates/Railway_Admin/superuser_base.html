<!-- superuser_base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Superuser Panel{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        nav {
            background: #1a1a2e;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .brand { font-size: 20px; font-weight: bold; }
        nav a, nav button {
            color: #fff;
            text-decoration: none;
            background: #e63946;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        nav button:hover, nav a:hover { background: #d62839; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
        }
        .modal-box h2 { margin-bottom: 15px; }
        .modal-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .modal-box button.submit-btn {
            width: 100%;
            background: #1a1a2e;
            padding: 10px;
        }
        .modal-box .close-btn {
            float: right;
            background: none;
            color: #333;
            font-size: 18px;
        }
        .error-text { color: #e63946; font-size: 13px; margin-bottom: 10px; }

        .content { padding: 30px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <div class="brand">Superuser Panel</div>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'superuser_logout' %}" style="margin:0;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <button onclick="openLoginModal()">Login</button>
        {% endif %}
    </nav>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            <h2>Superuser Login</h2>
            <div class="error-text" id="loginError" style="display:none;"></div>
            <form id="loginForm">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        function openLoginModal() {
            document.getElementById('loginModal').classList.add('active');
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        document.getElementById('loginForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const errorBox = document.getElementById('loginError');

            fetch("{% url 'superuser_login' %}", {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect_url;
                } else {
                    errorBox.textContent = data.error;
                    errorBox.style.display = 'block';
                }
            });
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
