<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        main { max-width: 420px; margin: 10vh auto; padding: 30px; background: #fff; border-radius: 8px; }
        h1 { margin-top: 0; }
        label { display: block; margin: 14px 0 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 10px; color: #fff; background: #1a1a2e; border: 0; border-radius: 4px; cursor: pointer; }
        ul { color: #e63946; padding-left: 20px; }
    </style>
</head>
<body>
    <main>
        <h1>Change Your Password</h1>
        <p>Your temporary password must be changed before continuing.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                {{ field.errors }}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            {% endfor %}
            <button type="submit">Change Password</button>
        </form>
    </main>
</body>
</html>
